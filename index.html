<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Porfolio - Ben Coake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Link to stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- =========================
       NAVIGATION PANEL
       ========================= -->
  <nav class="nav-panel">
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="work/index.html">Projects</a></li>
      <li><a href="assets/curriculum_vitae.pdf">CV</a></li>
      <li>
        <button id="theme-toggle" class="nav-button">Dark Mode</button>
      </li>
    </ul>
  </nav>

  <!-- =========================
       MAIN BODY PANEL
       ========================= -->
  <main class="body-panel">

    <!-- Hero / Intro Section -->
    <section class="hero hero-split">
      <div class="hero-text">
        <h1>Hi, I'm Ben!</h1>
        <p>
        I'm a Data Analyst currently based in London, UK.
        </p>
      </div>

      <div class="hero-image">
        <img src="assets/headshot-2.jpg" alt="Headshot of me" />
      </div >
    </section>

    <!-- Content Placeholder -->
    <section class="content">
      <h2>A bit about me...</h2>
      <div id="about-content"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      fetch('about.md')
        .then(response => response.text())
        .then(text => {
          document.getElementById('about-content').innerHTML = marked.parse(text);
        });
    </script>

    <br>

    <section class="latest-projects">
      <div class="latest-projects-header">
        <h2>Latest Projects</h2>

        <a href="/work/index.html" class="view-all-projects">
        View all projects →
        </a>
      </div>

      <div id="latest-projects-container"></div>
    </section>

  </main>

  <script>
    const toggleBtn = document.getElementById("theme-toggle");

    // Function to apply theme
    function applyTheme(theme) {
      if (theme === "dark") {
        document.body.classList.add("dark-mode");
        toggleBtn.textContent = "Light Mode";
      } else {
        document.body.classList.remove("dark-mode");
        toggleBtn.textContent = "Dark Mode";
      }
    }

    // Load theme on page load
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      applyTheme(savedTheme);
    }

    // Toggle button click
    toggleBtn.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark-mode");
      const theme = isDark ? "dark" : "light";

      localStorage.setItem("theme", theme); // save the theme
      applyTheme(theme);
  });
  </script>
  
  <script src="/assets/projects.js"></script>
  <script>
  const container = document.getElementById("latest-projects-container");

  // Sort newest → oldest
  const latestThree = [...PROJECTS]
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .slice(0, 3);

  container.innerHTML = latestThree.map(project => `
    <div class="project-card">
      <h2><a href="${project.url}">${project.title}</a></h2>
      <p>${project.description}</p>
    </div>
  `).join("");
  </script>

</body>
</html>
